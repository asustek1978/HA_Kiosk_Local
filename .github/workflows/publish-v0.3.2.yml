name: Publish HA Kiosk Local v0.3.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Home Assistant integration package
        run: |
          rm -rf release_package HA_Kiosk_Local_Home_Assistant_v0.3.2.zip
          mkdir -p release_package/custom_components
          cp hacs.json release_package/
          cp README.md release_package/
          cp -a custom_components/ha_kiosk release_package/custom_components/
          cd release_package
          zip -r ../HA_Kiosk_Local_Home_Assistant_v0.3.2.zip .
          cd ..
          ls -lh HA_Kiosk_Local_Home_Assistant_v0.3.2.zip

      - name: Keep downloadable package in repository
        run: |
          mkdir -p downloads
          cp HA_Kiosk_Local_Home_Assistant_v0.3.2.zip downloads/HA_Kiosk_Local_Home_Assistant_v0.3.2.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HA_Kiosk_Local_Home_Assistant_v0.3.2.zip
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HA Kiosk Local v0.3.2 integration package"
            git push
          fi

      - name: Create or update GitHub Release v0.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.2.zip"
          if gh release view v0.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.2 "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.2 "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HA Kiosk Local v0.3.2" \
              --notes "HA Kiosk Local v0.3.2 — Android kiosk application and local Home Assistant integration."
          fi
