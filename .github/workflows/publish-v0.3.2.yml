name: Publish HA Kiosk Local v0.3.2

on:
  push:
    branches:
      - main
    paths:
      - '.release-trigger-v0.3.2-final'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release v0.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="downloads/HA_Kiosk_Local_Home_Assistant_v0.3.2.zip"
          if gh release view v0.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.2 "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.2 "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HA Kiosk Local v0.3.2" \
              --notes "$(cat <<'EOF'
          ## HA Kiosk Local v0.3.2

          Первый релиз проекта под новым публичным названием **HA Kiosk Local**.

          ### В релизе
          - Home Assistant integration v0.3.2
          - локальный HTTP API с API key
          - WebRTC camera + microphone
          - motion / sound wake
          - выключение и пробуждение экрана по освещённости
          - fallback освещённости через камеру при отсутствии lux-сенсора
          - исправление CAMERA_IN_USE
          - battery / CPU / RAM / swap-zRAM telemetry
          - Device Admin / Device Owner support
          - reboot Android из Home Assistant при Device Owner

          ### Home Assistant
          Для HACS используйте custom repository:
          `https://github.com/asustek1978/HA_Kiosk_Local`

          Для ручной установки скачайте `HA_Kiosk_Local_Home_Assistant_v0.3.2.zip`.

          ### Android
          Готовый Android APK называется `HA_Kiosk_Local.apk`.
          Для обновления поверх существующей установки APK должен быть подписан тем же ключом, что и установленная версия.

          Внутренние идентификаторы сохранены для совместимости:
          - Android: `com.hakiosk.app`
          - Home Assistant: `ha_kiosk`
          EOF
          )"
          fi
