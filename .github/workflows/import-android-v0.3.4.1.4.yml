name: Import Android v0.3.4.1.4 source

on:
  push:
    paths:
      - '.source/v0.3.4.1.4.ready'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .source/android-v0.3.4.1.4.zip.b64.part-* > /tmp/android-source.b64
          base64 -d /tmp/android-source.b64 > /tmp/android-source.zip
          rm -rf /tmp/ha-kiosk-source
          mkdir -p /tmp/ha-kiosk-source
          unzip -q /tmp/android-source.zip -d /tmp/ha-kiosk-source
          SRC_DIR="$(find /tmp/ha-kiosk-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC_DIR"
          test -f "$SRC_DIR/app/build.gradle.kts"
          test -f "$SRC_DIR/home_assistant/custom_components/ha_kiosk/manifest.json"

          rm -rf android
          mkdir android
          cp -a "$SRC_DIR"/. android/
          rm -rf android/home_assistant

          # Keep the Android source tree focused on the current release.
          cp "$SRC_DIR/CHANGELOG_v0.3.4.1.4.md" android/CHANGELOG.md
          rm -f android/CHANGELOG_v0.3.3.md \
                android/CHANGELOG_v0.3.4.md \
                android/CHANGELOG_v0.3.4.1.md \
                android/CHANGELOG_v0.3.4.1.1.md \
                android/CHANGELOG_v0.3.4.1.2.md \
                android/CHANGELOG_v0.3.4.1.3.md \
                android/CHANGELOG_v0.3.4.1.4.md

          # Update the Home Assistant integration bundled with this Android source.
          rm -rf custom_components/ha_kiosk
          mkdir -p custom_components
          cp -a "$SRC_DIR/home_assistant/custom_components/ha_kiosk" custom_components/
          cp "$SRC_DIR/home_assistant/hacs.json" hacs.json

          # Trigger the release workflow only after both source trees are current.
          printf 'Android 0.3.4.1.4 + Home Assistant 0.3.4.1.5\n' > .release/v0.3.4.1.4

          # Temporary transport files are not part of the final repository.
          rm -rf .source
          rm -f .github/workflows/import-android-v0.3.4.1.4.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android custom_components/ha_kiosk hacs.json .release .source .github/workflows/import-android-v0.3.4.1.4.yml || true
          git commit -m "Publish Android v0.3.4.1.4 and HA integration v0.3.4.1.5"
          git push
