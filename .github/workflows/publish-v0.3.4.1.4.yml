name: Publish HA Kiosk Local v0.3.4.1.4

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/v0.3.4.1.4'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Home Assistant integration package
        run: |
          set -euo pipefail
          ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.4.1.5.zip"
          rm -rf release_package "$ASSET"
          mkdir -p release_package/custom_components
          cp hacs.json release_package/
          cp README.md release_package/
          cp -a custom_components/ha_kiosk release_package/custom_components/
          cd release_package
          zip -r "../$ASSET" .
          cd ..
          ls -lh "$ASSET"

      - name: Keep integration ZIP in repository
        run: |
          set -euo pipefail
          ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.4.1.5.zip"
          mkdir -p downloads
          cp "$ASSET" "downloads/$ASSET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/$ASSET"
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HA Kiosk Local integration v0.3.4.1.5 package"
            git push
          fi

      - name: Move release tag to current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.3.4.1.4" -f sha="$GITHUB_SHA" -F force=true >/dev/null || true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.3.4.1.4"
          HA_ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.4.1.5.zip"
          NOTES=$(cat <<'EOF'
          HA Kiosk Local current pair:

          - Android source: v0.3.4.1.4 (versionCode 21)
          - Home Assistant integration: v0.3.4.1.5

          Android v0.3.4.1.4:
          - separate numeric illuminance thresholds: screen off <= 0.5 lx, screen on >= 2.0 lx;
          - hysteresis keeps an already-on screen on at 1.5 lx;
          - fixes the false "port 2323 unavailable" toast on screen wake;
          - retries the local API bind silently up to 5 times.

          Home Assistant v0.3.4.1.5 exposes the two illuminance thresholds as number-box entities with 0.1 lx step.

          Important: no newly signed Android APK is published by GitHub Actions, because a different signing key would not update existing tablets. Install a v0.3.4.1.4 APK signed with the same key as the currently installed app.
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HA_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "HA Kiosk Local v0.3.4.1.4" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$HA_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HA Kiosk Local v0.3.4.1.4" \
              --notes "$NOTES"
          fi

          # Never leave an older Android APK attached to this updated release.
          # A replacement may be uploaded only after it is signed with the same
          # key used by the installed tablets.
          gh release delete-asset "$TAG" HA_Kiosk_Local.apk --yes --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
