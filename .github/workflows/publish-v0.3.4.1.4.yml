name: Publish HA Kiosk Local v0.3.4.1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Home Assistant integration package
        run: |
          set -e
          ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.4.1.4.zip"
          rm -rf release_package "$ASSET"
          mkdir -p release_package/custom_components
          cp hacs.json release_package/
          cp README.md release_package/
          cp -a custom_components/ha_kiosk release_package/custom_components/
          cd release_package
          zip -r "../$ASSET" .
          cd ..
          ls -lh "$ASSET"

      - name: Keep integration ZIP in repository
        run: |
          set -e
          ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.4.1.4.zip"
          mkdir -p downloads
          cp "$ASSET" "downloads/$ASSET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/$ASSET"
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HA Kiosk Local integration v0.3.4.1.4 package"
            git push
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.3.4.1.4"
          HA_ASSET="HA_Kiosk_Local_Home_Assistant_v0.3.4.1.4.zip"
          NOTES=$(cat <<'EOF'
          HA Kiosk Local current tested pair:

          - Android: v0.3.4.1.2
          - Home Assistant integration: v0.3.4.1.4

          Primary tablet camera uses Home Assistant-proxied MJPEG for local and remote viewing. RTSP and Direct WebRTC remain optional secondary camera entities.

          The Android APK must be the locally signed v0.3.4.1.2 build (package com.hakiosk.app) so it can update existing installations signed with the same key.
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HA_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$HA_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HA Kiosk Local v0.3.4.1.4" \
              --notes "$NOTES"
          fi

          # If the correctly signed Android APK has been placed in downloads,
          # include it automatically without rebuilding/re-signing it in Actions.
          if [ -f downloads/HA_Kiosk_Local.apk ]; then
            gh release upload "$TAG" downloads/HA_Kiosk_Local.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi
